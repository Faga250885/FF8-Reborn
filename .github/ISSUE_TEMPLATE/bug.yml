name: Report a bug / Informar de un fallo
description: Help reproduce an issue in FF8 Reborn. Puedes escribir en español.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: FF8 Reborn version / Versión
      placeholder: e.g. 1.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Where and how did it happen? / ¿Dónde y cómo ocurrió?
      description: Include the location, steps, what you expected and what appeared. Indica el lugar, los pasos, lo que esperabas y lo que apareció.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings and hardware / Ajustes y equipo
      description: FPS target, aspect ratio, filter, Windows version, GPU and display refresh rate if known.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or clip / Captura o vídeo
      description: Optional. A short clip helps with stutter or flicker. Puedes adjuntar un vídeo corto para mostrar tirones o parpadeos.
